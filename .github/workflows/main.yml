name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: 寻找工程根目录
        run: |
          set -e
          ROOT="."
          if [ ! -f settings.gradle ]; then
            FOUND=$(find . -maxdepth 4 -name settings.gradle -not -path "./.git/*" | head -1 || true)
            if [ -z "$FOUND" ]; then
              echo "没有 settings.gradle，现有文件："
              find . -maxdepth 3 -type f -not -path "./.git/*" | head -60
              exit 1
            fi
            ROOT=$(dirname "$FOUND")
          fi
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: 下载 jsQR
        run: |
          set -e
          DEST="$GITHUB_WORKSPACE/$ROOT/app/src/main/assets"
          mkdir -p "$DEST"
          curl -fL --retry 3 -o "$DEST/jsqr.min.js" \
            https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js \
          || curl -fL --retry 3 -o "$DEST/jsqr.min.js" \
            https://unpkg.com/jsqr@1.4.0/dist/jsQR.js
          test -s "$DEST/jsqr.min.js"
      - name: 编译 APK
        run: gradle -p "$ROOT" assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: call-order-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
